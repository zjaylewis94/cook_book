<meta name="apple-mobile-web-app-title" content="Cook Book">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#15110d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15110d; --card: #211a14; --card2: #2a2119; --line: #3a2e24;
    --text: #f3e9dc; --muted: #a8998a; --accent: #d9884a; --accent2: #f0a868;
    --green: #7fb069; --amber: #e0b04a; --red: #e05a5a;
    --hard: #e05a5a; --mod: #e0b04a; --rest: #7fb069;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; line-height: 1.35; padding-bottom: calc(72px + env(safe-area-inset-bottom)); overflow-x: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  header { position: sticky; top: 0; z-index: 20; background: rgba(21,17,13,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  .hdr { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 3px; color: var(--accent); line-height: 1; }
  .brand small { display: block; font-family: 'Share Tech Mono', monospace; font-size: .62rem; letter-spacing: 1px; color: var(--muted); margin-top: 3px; }
  .weeknav { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .weeknav button { background: var(--card); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; font-size: 1.1rem; }
  .weeknav .wk { font-family: 'Share Tech Mono', monospace; font-size: .8rem; text-align: center; min-width: 108px; }
  .weeknav .wk b { display: block; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 1rem; letter-spacing: 1px; color: var(--accent2); }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: #1b1510; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; background: none; border: 0; padding: 9px 0 10px; color: var(--muted); font-family: 'Bebas Neue', sans-serif; font-size: 1.05rem; letter-spacing: 2px; }
  nav.tabs button span { display: block; font-size: 1.2rem; line-height: 1.1; }
  nav.tabs button.on { color: var(--accent); }

  h2 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; letter-spacing: 2px; font-size: 1.4rem; margin: 18px 0 8px; color: var(--accent2); }
  h3 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; letter-spacing: 1.5px; font-size: 1.15rem; margin: 0; }
  .mono { font-family: 'Share Tech Mono', monospace; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap-row { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .btn { background: var(--card2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; font-weight: 600; letter-spacing: .5px; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #1a120b; }
  .btn.ghost { background: none; }
  .btn.sm { padding: 4px 9px; font-size: .9rem; }
  .btn.danger { color: var(--red); }
  .chip { display: inline-block; border-radius: 999px; padding: 2px 9px; font-family: 'Share Tech Mono', monospace; font-size: .75rem; border: 1px solid var(--line); background: var(--card2); white-space: nowrap; }
  .chip.hard { border-color: var(--hard); color: var(--hard); }
  .chip.mod { border-color: var(--mod); color: var(--mod); }
  .chip.rest { border-color: var(--rest); color: var(--rest); }
  .ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }
  .note { background: #2b1f12; border-left: 3px solid var(--accent); padding: 9px 11px; border-radius: 6px; margin: 10px 0; font-size: .95rem; }

  /* week summary */
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat .lbl { font-family: 'Share Tech Mono', monospace; font-size: .68rem; color: var(--muted); text-transform: uppercase; }
  .stat .val { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 1px; line-height: 1.1; }

  /* day cards */
  .day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .day-hd { display: flex; align-items: center; gap: 8px; }
  .day-hd .dname { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 2px; }
  .day-hd .ddate { font-family: 'Share Tech Mono', monospace; font-size: .75rem; color: var(--muted); }
  .day-hd .status { margin-left: auto; font-family: 'Share Tech Mono', monospace; font-size: .8rem; text-align: right; }
  .bars { margin: 8px 0 4px; display: grid; gap: 4px; }
  .bar { display: grid; grid-template-columns: 56px 1fr 92px; align-items: center; gap: 8px; font-family: 'Share Tech Mono', monospace; font-size: .72rem; color: var(--muted); }
  .bar .track { height: 7px; background: #120e0a; border-radius: 4px; overflow: hidden; position: relative; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar .fill.ok { background: var(--green); } .bar .fill.warn { background: var(--amber); } .bar .fill.bad { background: var(--red); }
  .bar .num { text-align: right; }
  .slot { margin-top: 8px; }
  .slot-hd { font-family: 'Share Tech Mono', monospace; font-size: .7rem; color: var(--muted); letter-spacing: 1px; display: flex; align-items: center; }
  .slot-hd button { margin-left: auto; background: none; border: 0; color: var(--accent); font-family: 'Share Tech Mono', monospace; font-size: .75rem; padding: 2px 4px; }
  .meal { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .meal:last-child { border-bottom: 0; }
  .meal .em { font-size: 1.2rem; width: 26px; text-align: center; }
  .meal .nm { flex: 1; min-width: 0; }
  .meal .nm b { font-weight: 600; display: block; cursor: pointer; line-height: 1.15; }
  .meal .nm small { color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: .7rem; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .stepper button { background: var(--card2); border: 0; width: 28px; height: 28px; font-size: 1rem; }
  .stepper span { font-family: 'Share Tech Mono', monospace; font-size: .8rem; min-width: 34px; text-align: center; }
  .x { background: none; border: 0; color: var(--muted); font-size: 1.1rem; padding: 2px 4px; }
  .empty { color: var(--muted); font-size: .9rem; padding: 4px 0; }
  details.more summary { cursor: pointer; color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: .75rem; list-style: none; }
  details.more summary::-webkit-details-marker { display: none; }

  /* shop */
  .sec-hd { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; color: var(--accent2); margin: 14px 0 4px; font-size: 1.1rem; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .item input[type=checkbox] { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; }
  .item .nm { flex: 1; min-width: 0; }
  .item .nm b { font-weight: 600; }
  .item .buy { font-family: 'Share Tech Mono', monospace; font-size: .78rem; color: var(--accent2); text-align: right; white-space: nowrap; }
  .item .need { font-family: 'Share Tech Mono', monospace; font-size: .72rem; color: var(--muted); }
  .item.got .nm, .item.got .buy { opacity: .4; text-decoration: line-through; }
  .prep { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); align-items: center; }

  /* recipes */
  .filters { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 600; }
  .filters button.on { background: var(--accent); color: #1a120b; border-color: var(--accent); }
  .search { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .rgrid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 560px) { .rgrid { grid-template-columns: 1fr 1fr; } }
  .rcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; text-align: left; width: 100%; }
  .rcard .em { font-size: 1.7rem; }
  .rcard b { display: block; font-weight: 600; }
  .macros { font-family: 'Share Tech Mono', monospace; font-size: .72rem; color: var(--muted); }
  .macros i { font-style: normal; color: var(--text); }
  .star { color: var(--accent); }

  /* sheet (modal) */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet-bg.hidden { display: none; }
  .sheet { background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); }
  .sheet-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sheet-hd h3 { font-size: 1.4rem; flex: 1; }
  .kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
  .kv div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: center; }
  .kv b { display: block; font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; font-weight: 400; letter-spacing: 1px; }
  .kv span { font-family: 'Share Tech Mono', monospace; font-size: .65rem; color: var(--muted); }
  .ings { margin: 6px 0; padding: 0; list-style: none; }
  .ings li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .ings li .q { font-family: 'Share Tech Mono', monospace; font-size: .8rem; color: var(--accent2); min-width: 112px; }
  ol.steps { padding-left: 20px; margin: 6px 0; }
  ol.steps li { margin: 4px 0; }
  .method { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 8px 0; }
  .method .lbl, .field label { font-family: 'Share Tech Mono', monospace; font-size: .7rem; color: var(--muted); letter-spacing: 1px; display: block; margin-bottom: 3px; }
  .field { margin: 8px 0; }
  .field input, .field select, .field textarea, .inp { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  .field textarea { min-height: 74px; resize: vertical; }

const TYPE_LABEL = { hard: 'HARD', mod: 'MODERATE', rest: 'REST' };

}

// Macros for one serving

// ============================================================
// DATES / WEEKS

function defaultWeek() { const n = new Date(); return iso(n.getDay() === 0 ? addDays(mondayOf(n), 7) : mondayOf(n)); }
function curWeek() { if (!S.week) S.week = defaultWeek(); return S.week; }
function weekNo(wk) { return Math.floor(parseIso(wk).getTime() / (7 * 86400000)); }

}
function shiftWeek(n) { S.week = iso(addDays(parseIso(curWeek()), 7 * n)); save(); render(); }
function fmtShort(d) { return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate(); }

// ============================================================
// HELPERS
// ============================================================
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function frac(n) {

}
function fmtQty(q, u) {

    return r0(q) + ' g' + (q >= 40 ? ' · ' + (Math.round(q / 28.35 * 2) / 2) + ' oz' : '');
  }
  if (u === 'ml') {
    if (q >= 950) return (Math.round(q / 100) / 10) + ' L · ' + (Math.round(q / 236.6 * 2) / 2) + ' cups';
    return r0(q) + ' ml · ' + frac(Math.round(q / 236.6 * 4) / 4) + ' cup';
  }
  const LBL = { ea: '', tbsp: ' tbsp', tsp: ' tsp', scoop: ' scoop', slice: ' slice', cup: ' cup' };
  const lbl = LBL.hasOwnProperty(u) ? LBL[u] : ' ' + u;
  const s = frac(Math.round(q * 4) / 4);
  return s + lbl + ((u === 'scoop' || u === 'slice' || u === 'cup') && q > 1.01 ? 's' : '');
}
function buyText(g, need) {
  if (!g.buy) return '';
  const size = g.buy[0], label = g.buy[1];
  if (label === 'lb') return '≈ ' + (Math.ceil(need / 453.6 * 4) / 4) + ' lb';
  const n = Math.max(1, Math.ceil(need / size - 0.05));

}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 1800); }
function dayTotals(day) {

}

// ---------- PLAN ----------
function renderPlan() {
  const wk = curWeek(), W = getWeek(wk), mon = parseIso(wk), todayIso = iso(new Date());
  let onT = 0, planned = 0, kSum = 0, tSum = 0;
  DAYS.forEach(function (d) { const v = verdict(W.days[d]); if (W.days[d].meals.length) { planned++; if (v.cls === 'ok') onT++; kSum += v.tot.k; tSum += v.t.k; } });
  let h = '<div class="summary">' +
    '<div class="stat"><div class="lbl">Days on target</div><div class="val">' + onT + ' <span class="muted small">/ 7</span></div></div>' +
    '<div class="stat"><div class="lbl">Avg cal / day</div><div class="val">' + (planned ? r0(kSum / planned).toLocaleString() : '—') + '</div></div>' +
    '<div class="stat"><div class="lbl">Week vs target</div><div class="val ' + (!planned ? '' : Math.abs(kSum - tSum) <= 150 * planned ? 'ok' : kSum < tSum ? 'warn' : 'bad') + '">' + (planned ? (kSum - tSum > 0 ? '+' : '') + r0(kSum - tSum).toLocaleString() : '—') + '</div></div>' +
    '</div>';

  DAYS.forEach(function (d, i) {

      '<div class="day-hd"><div><div class="dname">' + DAY_NAME[d] + '</div><div class="ddate">' + fmtShort(date) + '</div></div>' +
      '<button class="chip ' + day.type + '" onclick="cycleType(\'' + d + '\')" title="Tap to change">' + TYPE_LABEL[day.type] + '</button>' +
      '<div class="status ' + v.cls + '">' + v.txt + '<br><span class="muted">' + r0(v.tot.k).toLocaleString() + ' / ' + v.t.k.toLocaleString() + '</span></div></div>' +
      bars(v.tot, v.t);
    SLOTS.forEach(function (sl) {
      const ms = day.meals.filter(function (m) { return m.slot === sl[0]; });
      h += '<div class="slot"><div class="slot-hd">' + sl[1] + '<button onclick="openPicker(\'' + d + '\',\'' + sl[0] + '\')">+ ADD</button></div>';
      ms.forEach(function (m) {
        const r = recipe(m.r);

        const x = macros(r);

          '<div class="stepper"><button onclick="bump(\'' + d + '\',\'' + m.id + '\',-0.5)">−</button><span>' + frac(m.s) + '×</span><button onclick="bump(\'' + d + '\',\'' + m.id + '\',0.5)">+</button></div>' +
          '<button class="x" onclick="removeMeal(\'' + d + '\',\'' + m.id + '\')" aria-label="Remove">✕</button></div>';

}
function bars(tot, t) {
  // floor = more is fine (protein on a cut); otherwise over target goes red
  function bar(lbl, val, tg, unit, floor) {
    const pct = tg ? Math.min(100, val / tg * 100) : 0;
    const ratio = tg ? val / tg : 0;
    const cls = ratio >= 0.92 ? (ratio > 1.06 && !floor ? 'bad' : 'ok') : 'warn';
    return '<div class="bar"><span>' + lbl + '</span><div class="track"><div class="fill ' + cls + '" style="width:' + pct + '%"></div></div><span class="num">' + r0(val) + ' / ' + tg + unit + '</span></div>';
  }
  return '<details class="more"><summary><div class="bars">' + bar('CAL', tot.k, t.k, '') + bar('PROTEIN', tot.p, t.p, 'g', true) + '</div></summary><div class="bars">' + bar('CARBS', tot.c, t.c, 'g') + bar('FAT', tot.f, t.f, 'g') + '</div></details>';

function cycleType(d) { const W = getWeek(curWeek()); const order = ['hard', 'mod', 'rest']; W.days[d].type = order[(order.indexOf(W.days[d].type) + 1) % 3]; save(); render(); }
function bump(d, id, by) {
  const W = getWeek(curWeek()); const m = W.days[d].meals.find(function (x) { return x.id === id; }); if (!m) return;

}
function removeMeal(d, id) { const W = getWeek(curWeek()); W.days[d].meals = W.days[d].meals.filter(function (x) { return x.id !== id; }); save(); render(); }

function copyLastWeek() {
  const prev = S.weeks[iso(addDays(parseIso(curWeek()), -7))];
  if (!prev || !DAYS.some(function (d) { return prev.days[d].meals.length; })) { toast('Last week is empty'); return; }
  const W = getWeek(curWeek());
  if (DAYS.some(function (d) { return W.days[d].meals.length; }) && !confirm('Replace this week with last week\'s meals?')) return;
  DAYS.forEach(function (d) { W.days[d].type = prev.days[d].type; W.days[d].meals = prev.days[d].meals.map(function (m) { return { id: uid(), r: m.r, s: m.s, slot: m.slot }; }); });
  save(); render(); toast('Copied last week');
}

// ---------- AUTO-FILL ----------
function pool(cat) {
  const all = recipes().filter(function (r) { return r.cat === cat; });
  const fav = all.filter(function (r) { return S.favs[r.id]; });
  return fav.length ? fav : all;
}
function autoFill(rebuild) {
  const wk = curWeek(), W = getWeek(wk);
  if (rebuild && DAYS.some(function (d) { return W.days[d].meals.length; }) && !confirm('Rebuild the whole week? Your current picks get replaced.')) return;
  const n = weekNo(wk);
  const prepPool = pool('Meal Prep'), quick = pool('Quick'), dinners = pool('Dinner'), bfast = pool('Breakfast');
  const lunch = prepPool.length ? prepPool[n % prepPool.length].id : null;   // one batch for Mon–Fri, rotates weekly
  // Batch dinners (makes 2+) run two nights in a row: cook once, eat twice
  const dinnerSeq = [];
  for (let j = 0; dinners.length && dinnerSeq.length < 7; j++) {
    const r = dinners[(j + n) % dinners.length];
    dinnerSeq.push(r.id);
    if ((r.yield || 1) > 1 && dinnerSeq.length < 7) dinnerSeq.push(r.id);
  }
  const has = function (id) { return !!recipe(id); };
  // Snacks that top a day up: favorites first, then by protein per calorie
  const fillers = recipes().filter(function (r) { return r.cat === 'Snack' && ['s-prerun', 's-shake', 's-recovery', 's-lyte', 's-coldbrew'].indexOf(r.id) < 0; })
    .sort(function (a, b) { const fa = S.favs[a.id] ? 1 : 0, fb = S.favs[b.id] ? 1 : 0; if (fa !== fb) return fb - fa; const ma = macros(a), mb = macros(b); return (mb.p / mb.k) - (ma.p / ma.k); });
  let filled = 0;
  DAYS.forEach(function (d, i) {
    const day = W.days[d];
    if (!rebuild && day.meals.length) return;
    day.meals = [];
    const t = target(day.type);
    const add = function (id, slot, s) { if (id && has(id)) { const m = { id: uid(), r: id, s: s || 1, slot: slot }; day.meals.push(m); return m; } return null; };
    const tot = function () { return dayTotals(day); };
    add(bfast.length ? bfast[(i + n) % bfast.length].id : null, 'B');
    if (i < 5) add(lunch, 'L'); else add(quick.length ? quick[(i + n) % quick.length].id : lunch, 'L');
    const dinner = add(dinnerSeq[i] || null, 'D');
    if (day.type === 'hard') { add('s-prerun', 'S'); add(has('s-recovery') ? 's-recovery' : 's-shake', 'S'); }
    else add('s-shake', 'S');
    const added = [];
    // Rotate which top-up leads each day so it isn't cottage cheese 7 days straight
    for (let j = 0; j < fillers.length && tot().k < t.k - 150; j++) { const m = add(fillers[(j + i) % fillers.length].id, 'S'); if (m) added.push(m); }
    // Still short: bigger portions of the main meals
    for (let g = 0; g < 6 && tot().k < t.k - 150; g++) {
      const mains = day.meals.filter(function (m) { return m.slot !== 'S' && m.s < 2; });
      if (!mains.length) break;
      mains[g % mains.length].s += 0.5;

    // Over: drop the last top-ups, then trim dinner
    while (tot().k > t.k + 150 && added.length) { const m = added.pop(); day.meals = day.meals.filter(function (x) { return x !== m; }); }
    while (tot().k > t.k + 150 && dinner && dinner.s > 0.5) dinner.s -= 0.25;
    filled++;
  });
  save(); render();
  toast(filled ? 'Filled ' + filled + ' day' + (filled > 1 ? 's' : '') : 'Every day already has meals');
}

// ---------- PICKER ----------
let pickCat = 'Fav';

}

      '<div class="macros"><i>' + r0(x.k) + '</i> cal · <i>' + r0(x.p) + '</i>p · ' + r0(x.c) + 'c · ' + r0(x.f) + 'f · ' + esc(r.serving) + '</div></div><div class="btn sm pri">+</div></div>';

function repick(d, slot, q) {

}

// ---------- SHOP ----------
function weekNeeds(W) {
  const need = {}, prep = {};
  DAYS.forEach(function (d) {
    W.days[d].meals.forEach(function (m) {
      const r = recipe(m.r); if (!r) return;
      const f = m.s / (r.yield || 1);
      (r.ing || []).forEach(function (row) { need[row[0]] = (need[row[0]] || 0) + row[1] * f; });
      if ((r.yield || 1) > 1) prep[r.id] = (prep[r.id] || 0) + m.s;

  });

}
function renderShop() {

  if (!ids.length) return '<h2>SUNDAY SHOP</h2><div class="note">No meals planned for this week yet. Plan the week first (PLAN → ⚡ Fill empty days) and the list builds itself, with amounts.</div>' + staplesHtml(W);
  const buy = ids.filter(function (id) { return !ing(id).pantry; }), pantry = ids.filter(function (id) { return ing(id).pantry; });
  const left = buy.filter(function (id) { return !W.got[id]; }).length;
  let h = '<h2>SUNDAY SHOP</h2><div class="row wrap-row"><span class="muted">' + left + ' of ' + buy.length + ' items left</span><span class="grow"></span>' +

function toggleGot(id, on) { const W = getWeek(curWeek()); if (on) W.got[id] = true; else delete W.got[id]; save(); render(); }

function copyList() {
  const W = getWeek(curWeek()), x = weekNeeds(W), mon = parseIso(curWeek());

function toggleFav(id, sv) { if (S.favs[id]) delete S.favs[id]; else S.favs[id] = true; save(); render(); openRecipe(id, sv || undefined); }

  save(); render(); toast('Logged');
}
function delCheckin(id) { S.checkins = S.checkins.filter(function (c) { return c.id !== id; }); save(); render(); }
// Rate over the last ~2 weeks. Target band: 0.5–2 lb/week down.
function trendAdvice(ci) {
  if (ci.length < 2) return 'Log again next Sunday and the book starts telling you whether to eat more or less.';
  const last = ci[ci.length - 1];
  let base = null;
  for (let i = ci.length - 2; i >= 0; i--) { const days = (parseIso(last.d) - parseIso(ci[i].d)) / 86400000; if (days >= 13) { base = ci[i]; break; } if (days >= 6) base = ci[i]; }
  if (!base) return 'Need a week between check-ins to read the trend.';
  const wks = (parseIso(last.d) - parseIso(base.d)) / (7 * 86400000);
  const rate = (base.w - last.w) / wks;
  const waist = (base.a && last.a) ? ' Waist ' + (last.a <= base.a ? 'down ' : 'up ') + Math.abs(last.a - base.a).toFixed(2) + '".' : '';
  if (rate < 0.5) return '<b>Losing ' + rate.toFixed(1) + ' lb/week</b> (goal 0.5–2).' + waist + ' Trim the targets: <button class="btn sm" onclick="nudge(-150)">−150 cal every day type</button>';
  if (rate > 2) return '<b>Losing ' + rate.toFixed(1) + ' lb/week</b>, faster than 2. You\'ll lose muscle and your runs will feel it.' + waist + ' <button class="btn sm" onclick="nudge(150)">+150 cal every day type</button>';
  return '<b class="ok">On pace: ' + rate.toFixed(1) + ' lb/week.</b>' + waist + ' Change nothing.';
}
function nudge(by) { ['hard', 'mod', 'rest'].forEach(function (k) { S.targets[k] = S.targets[k] || clone(DEFAULT_TARGETS[k]); S.targets[k].k += by; }); save(); render(); toast((by > 0 ? '+' : '') + by + ' cal on every day type'); }
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cookbook-backup-' + iso(new Date()) + '.json'; a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
function importData(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = function () {
    try { const s = JSON.parse(rd.result); if (!s || s.v !== 1) throw 0; if (!confirm('Replace everything here with the backup?')) return; S = Object.assign(blank(), s); save(); render(); toast('Backup restored'); }
    catch (e) { alert('That file isn\'t a Cook Book backup.'); }
  };
  rd.readAsText(file);
}
function restoreStarters() { S.hidden = {}; SEED_RECIPES.forEach(function (r) { if (S.myRecipes[r.id] && !confirm('Reset your edits to "' + r.name + '"?')) return; delete S.myRecipes[r.id]; }); save(); render(); toast('Starters restored'); }

// ---------- SHEET ----------
function openSheet(html) { document.getElementById('sheet').innerHTML = html; document.getElementById('sheetbg').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function closeSheet() { document.getElementById('sheetbg').classList.add('hidden'); document.body.style.overflow = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

render();
// Land on today's card
setTimeout(function () {
  if (S.tab !== 'plan' || curWeek() !== iso(mondayOf(new Date()))) return;
  const el = document.getElementById('day-' + DAYS[(new Date().getDay() + 6) % 7]);
  if (el && el.getBoundingClientRect().top > window.innerHeight * 0.6) el.scrollIntoView({ block: 'start' });
}, 50);
</script>
